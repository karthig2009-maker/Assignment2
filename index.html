<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tamil Nadu Police Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: space-between;
      align-items: center;
    }
    header {
      margin-top: 20px;
      text-align: center;
    }
    header img {
      height: 120px;
    }
    .login-container {
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    form {
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 12px rgba(0,0,0,0.15);
      width: 300px;
    }
    form h2 {
      margin-bottom: 20px;
      text-align: center;
      color: #004080;
    }
    label {
      font-weight: bold;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    input[type="submit"] {
      width: 100%;
      padding: 10px;
      background-color: #004080;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    input[type="submit"]:hover {
      background-color: #003366;
    }
    footer {
      margin-bottom: 20px;
      text-align: center;
      font-weight: bold;
      color: #004080;
    }
  </style>
</head>
<body>
  <header>
    <!-- Updated with image file name 1.jpg -->
    <img src="1.jpg" alt="Logo for Tamil Nadu Police Department">
  </header>

  <div class="login-container">
    <form>
      <h2>Login</h2>
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required>
      
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
      
      <input type="submit" value="Login">
    </form>
  </div>

  <footer>
    Tamil Nadu Police Department
  </footer>
</body>
</html>
